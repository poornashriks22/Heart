<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crores of I Love You</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,'Segoe UI',sans-serif;color:#ffd6e3}
  canvas{position:fixed;inset:0;width:100vw;height:100vh}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
  #title{position:fixed;top:7vh;width:100%;text-align:center;pointer-events:none;font-weight:800;letter-spacing:.35em;font-size:clamp(14px,2.4vw,30px);
    text-shadow:0 0 18px #ff3d6e,0 0 50px #ff1a55;animation:fade 9s ease-in-out forwards}
  #title small{display:block;margin-top:10px;font-weight:500;letter-spacing:.25em;font-size:.45em;opacity:.8}
  @keyframes fade{0%{opacity:0;transform:translateY(10px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
  #hud{position:fixed;left:20px;bottom:18px;pointer-events:none;font-size:12px;letter-spacing:2px;line-height:1.8;opacity:.85;text-shadow:0 0 10px #ff3d6e}
  #hud b{font-size:clamp(18px,2.6vw,30px);color:#fff;font-variant-numeric:tabular-nums;letter-spacing:1px}
  #zm{position:fixed;right:20px;bottom:18px;pointer-events:none;font-size:12px;letter-spacing:2px;opacity:.85;text-shadow:0 0 10px #ff3d6e;text-align:right}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000;color:#ff86ab;text-align:center;font:600 18px/1.7 system-ui;padding:20px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="title">∞ CRORES OF “I LOVE YOU” ∞<small>32 LANGUAGES · ONE HEART</small></div>
<div id="hud">WORDS OF LOVE<br><b id="n">0</b><br><span id="cr"></span></div>
<div id="zm">ZOOM<br><b id="z" style="font-size:20px;color:#fff">×1</b></div>
<div id="msg"></div>

<script>
const PH=["I love you","நான் உன்னை காதலிக்கிறேன்","Te amo","愛してる","사랑해","Je t'aime","నిన్ను ప్రేమిస్తున్నాను","Ich liebe dich",
"मैं तुमसे प्यार करता हूँ","Ti amo","我爱你","ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു","Seni seviyorum","Я тебя люблю","ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ",
"أحبك","Σ' αγαπώ","Ik hou van jou","আমি তোমাকে ভালোবাসি","Jag älskar dig","Aku cinta kamu","Anh yêu em","Kocham cię",
"ฉันรักเธอ","Eu te amo","אני אוהב אותך","Mahal kita","Ngiyakuthanda","Rakastan sinua","Szeretlek","Te iubesc","Volim te"];
const P=PH.length,FONT='"Nirmala UI","Segoe UI","Noto Sans","Noto Sans Tamil","Arial Unicode MS",Arial,sans-serif';
const $=id=>document.getElementById(id),cv=$('c');
const fail=t=>{const m=$('msg');m.style.display='flex';m.innerHTML=t};
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
if(!gl)fail('⚠ Your browser does not support WebGL2.<br>Please use the latest Chrome, Edge or Firefox.');

const VS=`#version 300 es
precision highp float;precision highp int;
uniform float uT,uZ,uAsp,uGain,uP,uH;uniform vec2 uC;
out vec2 vUV;out vec4 vCol;
uint pcg(uint v){uint s=v*747796405u+2891336453u;uint w=((s>>((s>>28u)+4u))^s)*277803737u;return (w>>22u)^w;}
float R(uint x){return float(pcg(x))/4294967296.;}
void main(){
  uint id=uint(gl_InstanceID);
  float a=R(id*8u+1u),b=R(id*8u+2u),c=R(id*8u+3u),d=R(id*8u+4u),e=R(id*8u+5u),f=R(id*8u+6u),cc=R(id*8u+7u);
  float t=a*6.2831853;
  vec2 hc=vec2(16.*pow(sin(t),3.),13.*cos(t)-5.*cos(2.*t)-2.*cos(3.*t)-cos(4.*t))/17.;hc.y-=.05;
  bool edge=d<.12;
  float s=edge?1.+(b-.5)*.03:sqrt(b);
  vec2 p=hc*s;float ph=c*6.2831853;
  p+=.004*vec2(sin(uT*.8+ph),cos(uT*.7+ph*1.3));
  p*=1.+.035*pow(max(0.,sin(uT*3.2)),6.);
  float w=.0026*mix(.6,1.5,e);
  float sc=max(1.,2.2/(w*uZ*uH));
  vec2 k=vec2(float(gl_VertexID&1),float(gl_VertexID>>1));
  vec2 pos=(p-uC+(k-.5)*vec2(w,w*.125)*sc)*uZ;
  gl_Position=vec4(pos.x/uAsp,pos.y,0.,1.);
  vUV=vec2(k.x,(floor(f*uP)+1.-k.y)/uP);
  vec3 col=mix(vec3(1.,.12,.32),vec3(1.,.5,.68),cc);
  if(cc>.92)col=vec3(1.,.82,.5);if(cc>.985)col=vec3(1.);
  float tw=.6+.4*sin(uT*4.+ph*9.);
  vCol=vec4(col,tw*uGain/(sc*sc)*(edge?1.7:1.));
}`;
const FS=`#version 300 es
precision mediump float;uniform sampler2D uTex;in vec2 vUV;in vec4 vCol;out vec4 o;
void main(){float a=texture(uTex,vUV).a;o=vec4(vCol.rgb*a*vCol.a,1.);}`;

let prog,U={},N=4e6,asp=1,lastT=performance.now(),fpsE=60,adaptT=0;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o}
try{
  prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);['uT','uZ','uAsp','uGain','uP','uH','uC','uTex'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
}catch(e){fail('⚠ Shader error<br><small>'+e.message+'</small>')}

/* text atlas: one row per language */
const at=document.createElement('canvas');at.width=512;at.height=64*P;const ax=at.getContext('2d');
ax.fillStyle='#fff';ax.textAlign='center';ax.textBaseline='middle';ax.font=`600 38px ${FONT}`;
PH.forEach((t,i)=>ax.fillText(t,256,64*i+34,480));
const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,at);gl.generateMipmap(gl.TEXTURE_2D);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
const an=gl.getExtension('EXT_texture_filter_anisotropic');if(an)gl.texParameterf(gl.TEXTURE_2D,an.TEXTURE_MAX_ANISOTROPY_EXT,8);
gl.bindVertexArray(gl.createVertexArray());
gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.uniform1i(U.uTex,0);gl.uniform1f(U.uP,P);

function resize(){const r=Math.min(devicePixelRatio||1,1.5);cv.width=innerWidth*r;cv.height=innerHeight*r;asp=cv.width/cv.height;gl.viewport(0,0,cv.width,cv.height);gl.uniform1f(U.uH,cv.height/2);gl.uniform1f(U.uAsp,asp)}
resize();addEventListener('resize',resize);

const MAXZ=170,PERIOD=56,smooth=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const fmt=n=>Math.floor(n).toLocaleString('en-IN');
let t0=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const T=(now-t0)/1000,dt=now-lastT;lastT=now;fpsE+=(1000/Math.max(dt,1)-fpsE)*.06;
  // camera: slow zoom-in and back out
  const prog=.5-.5*Math.cos(T*6.2831853/PERIOD),z=Math.exp(Math.log(MAXZ)*prog),pp=Math.pow(prog,1.4);
  const cx=(.27+.05*Math.sin(T*.3))*pp,cy=(.17+.04*Math.cos(T*.23))*pp;
  gl.uniform1f(U.uT,T);gl.uniform1f(U.uZ,z);gl.uniform2f(U.uC,cx,cy);gl.uniform1f(U.uGain,2.4-1.4*smooth(1,25,z));
  gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,N|0);
  // auto-tune the number of words to this GPU (up to 1 crore)
  adaptT+=dt;if(adaptT>2200&&T>1.5){adaptT=0;
    if(fpsE<26&&N>1e6)N=Math.max(1e6,N*.65);else if(fpsE>52&&N<1e7)N=Math.min(1e7,N*1.5)}
  $('n').textContent=fmt(N);$('cr').textContent=(N/1e7).toFixed(2)+' CRORE  ·  '+(N/1e5).toFixed(0)+' LAKH';
  $('z').textContent='×'+z.toFixed(z<10?1:0);
}
if(gl&&prog)requestAnimationFrame(frame);
</script>
</body>
</html>
